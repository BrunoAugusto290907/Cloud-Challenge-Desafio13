<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalie o Atendimento - Enviar Avaliação</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Avalie o Atendimento</h1>
    <nav>
      <a href="index.html" class="active">Avaliar Serviço</a>
      <a href="mural.html">Mural Público</a>
      <a href="painel.html">Painel de Satisfação</a>
      <a href="gestor.html">Moderação (Gestor)</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2 id="titulo-form">Envia sua Avaliação</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">
        Escolha se deseja publicar sua avaliação no mural público ou enviá-la de forma privada apenas para o gestor.
      </p>

      <div id="alert-box" class="alert"></div>

      <form id="form-avaliacao" novalidate>
        <div class="form-group">
          <label for="visibilidade">Tipo de Avaliação *</label>
          <select id="visibilidade" required>
            <option value="publica">Avaliação Pública (Aparece no Mural Público)</option>
            <option value="privada">Avaliação Privada (Aparece apenas na tela do Gestor)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="servico_id">Serviço da Unidade *</label>
          <select id="servico_id" required>
            <option value="">Selecione um serviço...</option>
            <option value="1">Secretaria</option>
            <option value="2">Biblioteca</option>
            <option value="3">Cantina</option>
            <option value="4">Laboratórios</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nota">Nota do Atendimento (1 a 5) *</label>
          <input
            type="number"
            id="nota"
            step="any"
            placeholder="Digite uma nota inteira de 1 a 5 (ex: 5)"
            required
          >
        </div>

        <div class="form-group">
          <label for="comentario" id="label-comentario">Comentário (opcional, máximo de 280 caracteres)</label>
          <textarea
            id="comentario"
            placeholder="Escreva aqui seu elogio, crítica ou sugestão..."
          ></textarea>
          <div id="char-count" class="char-counter">0 / 280 caracteres</div>
        </div>

        <button type="submit" id="btn-enviar">Enviar Avaliação Pública</button>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
